- name: Check install nginx
  command: pacman -Q nginx
  register: nginx_check
  failed_when: false
  changed_when: false
- name: Install nginx(if he dont install)
  community.general.pacman:
    name: nginx
    state: latest
    update_cache: yes
  when: nginx_check.rc != 0

- name: copy nginx config from template
  template:
    src: 'site.conf.j2'
    dest: '/etc/nginx/conf.d/site-{{ item }}.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ sites }}'
  notify: Reload nginx
- name: create  sites folders
  file:
    path: '/var/www/{{ item }}/'
    state: directory
  loop: '{{ sites }}'

- name: copy index from template
  template:
    src: 'index.html.j2'
    dest: '/var/www/{{ item }}/index.html'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ sites }}'
